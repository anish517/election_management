# /etc/nginx/sites-available/election  ->  symlink into sites-enabled
# Flutter web bundle at /, Django API (/v1/) and admin (/admin/) via the gunicorn socket.
# Cloudflare proxies this host; conf.d/cloudflare-realip.conf restores the client IP.
# certbot --nginx -d election.omwaytechnologies.com adds the 443 block and redirect.

limit_req_zone $binary_remote_addr zone=election_api:10m  rate=50r/s;
limit_req_zone $binary_remote_addr zone=election_vote:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;
    server_name election.omwaytechnologies.com;

    # Candidate photos, official stamps, payment slips, member CSV imports.
    client_max_body_size 25m;

    access_log /srv/election/logs/nginx-access.log;
    error_log  /srv/election/logs/nginx-error.log;

    location /static/ { alias /srv/election/static/; expires 30d; access_log off; }
    location /media/  { alias /srv/election/media/;  expires 7d; }

    # Vote casting and OTP verification get a stricter limit.
    location ~ ^/v1/voting/(direct-cast|kiosk/cast|verify-web-otp)/ {
        limit_req zone=election_vote burst=10 nodelay;
        include /etc/nginx/snippets/election-proxy.conf;
    }
    location ~ ^/(v1|admin)/ {
        limit_req zone=election_api burst=20 nodelay;
        include /etc/nginx/snippets/election-proxy.conf;
    }

    # Flutter web bundle. Entry points are never cached; everything else is safe to cache.
    root /srv/election/www;
    index index.html;
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|flutter\.js|main\.dart\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
