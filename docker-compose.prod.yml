services:
  # 1. PostgreSQL 16 Production Database
  postgres:
    image: postgres:16-alpine
    container_name: ems_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ems_prod}
      POSTGRES_USER: ${POSTGRES_USER:-ems_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisPassword123!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems_user} -d ${POSTGRES_DB:-ems_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems_internal

  # 2. Redis 7 Cache & Celery Task Broker
  redis:
    image: redis:7-alpine
    container_name: ems_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems_internal

  # 3. Django REST API Backend (Gunicorn + Uvicorn)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems_backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    networks:
      - ems_internal

  # 4. Celery Worker (Asynchronous Task Processing: SMS OTP, Email, Receipts)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems_celery_worker
    restart: always
    command: celery -A ems_backend worker -l INFO --concurrency=4
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media
    networks:
      - ems_internal

  # 5. Celery Beat (Periodic Scheduler for Automatic Election State Advancement)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems_celery_beat
    restart: always
    command: celery -A ems_backend beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ems_internal

  # 6. Nginx Reverse Proxy & Static Asset Gateway
  nginx:
    image: nginx:1.27-alpine
    container_name: ems_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./election_management/build/web:/var/www/ems/web:ro
      - media_volume:/var/www/ems/backend/media:ro
      - static_volume:/var/www/ems/backend/staticfiles:ro
      - certs_volume:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - ems_internal

volumes:
  pgdata:
  redisdata:
  media_volume:
  static_volume:
  certs_volume:

networks:
  ems_internal:
    driver: bridge
