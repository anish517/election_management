name: election_management
description: "Election Management System - Secure digital voting platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # HTTP Client
  dio: ^5.7.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^1.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Utilities
  intl: ^0.20.1
  file_picker: ^8.1.2
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.2
  nepali_date_picker: ^6.0.2
  nepali_utils: ^3.0.8
  flutter_colorpicker: ^1.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  json_serializable: ^6.9.3
  json_annotation: ^4.9.0

  http: any
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
